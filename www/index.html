    <!-- Strict CSP to eliminate eval() and contain script/frame execution -->

                   connect-src 'self' https://ts11dev.outsystems.net;

                   img-src 'self' data: https:; 
                   frame-src 'none'; 
                   object-src 'none';">

    <title>Your App</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div class="app">
        <!-- App content -->
    </div>

    <script src="js/index.js"></script>
</body>
</html>
